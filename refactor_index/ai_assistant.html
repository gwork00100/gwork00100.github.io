<!-- AI Assistant Component Content -->
<div style="flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #1e293b; color: #f8fafc; font-family: inherit;">
    <!-- Top Header Bar -->
    <div style="padding: 12px 16px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 8px;">
            <span style="width: 8px; height: 8px; background: #22c55e; border-radius: 50%;"></span>
            <strong style="font-size: 14px;">🧠 PrimeShift AI Assistant (Zoe)</strong>
        </div>
    </div>

    <!-- Messages List Container -->
    <div style="flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;" id="aiAssistantMessagesList">
        <div style="background: #334155; padding: 10px 14px; border-radius: 10px; font-size: 13px; max-width: 80%; border: 1px solid #475569;">
            Hi there! I'm Zoe, your AI shopping and product assistant. Ask me anything about our products, recommendations, or order tracking!
        </div>
    </div>

    <!-- Input Bar -->
    <div style="padding: 12px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 8px; align-items: center;">
        <input type="text" id="aiAssistantInput" placeholder="Ask Zoe a question..." style="flex: 1; padding: 9px 12px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 13px; outline: none;">
        <button type="button" id="aiAssistantSend" style="padding: 9px 16px; background: #3b82f6; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px;">Ask</button>
    </div>
</div>
