<style>
    .language-selector {
        position: relative;
        display: inline-flex;
        align-items: center;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        padding: 5px 8px;
        border: 1px solid transparent;
        border-radius: 2px;
    }
    .language-selector:hover {
        border-color: #ffffff;
    }
    .language-select-native {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
    }
    .language-content {
        display: flex;
        align-items: center;
        gap: 4px;
        pointer-events: none;
    }
    .language-content::after {
        content: "";
        display: inline-block;
        width: 0;
        height: 0;
        margin-left: 4px;
        vertical-align: middle;
        border-top: 4px solid #a7a7a7;
        border-right: 4px solid transparent;
        border-left: 4px solid transparent;
    }
    .language-select-native option {
        background: #131921;
        color: white;
        padding: 6px 10px;
    }
</style>

    window.updatePageText = function(lang) {
        const t = window.translations[lang] || window.translations["en"];
        document.querySelectorAll("[data-i18n]").forEach(el => {
            const key = el.getAttribute("data-i18n");
            if (t[key]) el.innerText = t[key];
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
            const key = el.getAttribute("data-i18n-placeholder");
            if (t[key]) el.placeholder = t[key];
        });
    };

    function applyLanguageChange(lang) {
        window.currentLang = lang;
        const config = window.translations[lang] || window.translations["en"];
        
        const flagEl = document.getElementById("langFlag");
        if (flagEl) flagEl.innerText = config.flag;
        
        const codeEl = document.getElementById("langCode");
        if (codeEl) codeEl.innerText = config.code;

        window.updatePageText(lang);

        if (!window.currentUser) {
            const helloEl = document.getElementById("accountHello");
            if (helloEl) helloEl.innerText = config.hello;
        }
    }

    const langSelect = document.getElementById("languageSelect");
    if (langSelect) {
        langSelect.addEventListener("change", function() {
            applyLanguageChange(this.value);
        });
    }

    // Immediately trigger on load to catch default or pre-set values
    if (langSelect) {
        applyLanguageChange(langSelect.value);
    }
