<!-- refactor_index/messaging.html -->
<div id="msgListView" style="flex: 1; display: flex; flex-direction: column; padding: 16px; gap: 12px; overflow-y: auto;">
    <div style="position: relative;">
        <input type="text" placeholder="🔍 Search conversations..." style="width: 100%; padding: 10px 14px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 13px; outline: none;">
    </div>
    <div style="display: flex; gap: 10px;">
        <button type="button" style="flex: 1; padding: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #cbd5e1; font-weight: 500; font-size: 13px; cursor: pointer;">+ New Message</button>
        <button type="button" style="flex: 1; padding: 10px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #cbd5e1; font-weight: 500; font-size: 13px; cursor: pointer;">👥 Create Group</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px;">
        <div onclick="openConversation('Ava Johnson')" style="padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 36px; height: 36px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; position: relative;">
                    AJ
                    <span style="position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; background: #22c55e; border: 2px solid #1e293b; border-radius: 50%;"></span>
                </div>
                <div>
                    <div style="font-weight: 600; font-size: 13px;">Ava Johnson</div>
                    <div style="color: #94a3b8; font-size: 12px; margin-top: 2px;">Are you free today?</div>
                </div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
                <span style="color: #64748b; font-size: 11px;">2m</span>
                <span style="background: #3b82f6; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold;">1</span>
            </div>
        </div>

        <div onclick="openConversation('Liam Carter')" style="padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 36px; height: 36px; background: #6366f1; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px;">LC</div>
                <div>
                    <div style="font-weight: 600; font-size: 13px;">Liam Carter</div>
                    <div style="color: #94a3b8; font-size: 12px; margin-top: 2px;">Thanks!</div>
                </div>
            </div>
            <span style="color: #64748b; font-size: 11px;">10m</span>
        </div>

        <div onclick="openConversation('Zoe Team')" style="padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 36px; height: 36px; background: #059669; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px;">ZT</div>
                <div>
                    <div style="font-weight: 600; font-size: 13px;">Zoe Team</div>
                    <div style="color: #94a3b8; font-size: 12px; margin-top: 2px;">Alex: Updated docs...</div>
                </div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
                <span style="color: #64748b; font-size: 11px;">1h</span>
                <span style="background: #3b82f6; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold;">3</span>
            </div>
        </div>
    </div>
</div>
