<script>
    document.querySelectorAll(".categories a[data-category]").forEach(l => {
        l.onclick = e => {
            e.preventDefault();
            const category = l.dataset.category.toLowerCase().trim();
            if (typeof window.renderProducts === "function") {
                window.renderProducts(category);
            }
        };
    });
</script>
